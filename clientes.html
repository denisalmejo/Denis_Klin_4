<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="limpieza.html">LIMPIEZA</a></li>
                <li><a href="autos.html">AUTOS</a></li>
                <li><a href="jarceria.html">JARCERÍA</a></li>
                <li><a href="belleza.html">BELLEZA</a></li>
                <li><a href="clientes.html">CLIENTES</a></li>
            </ul>
        </nav>
    </header>
    <br><br>

    <main>
        <center>
            
            <div class="neon">
                COMPARTE TU EXPERIENCIA COMO NUESTRO CLIENTE
            </div>
            <br><br>

            <form method = "post">
                    
                    <label for="nombre">INGRESE SU NOMBRE</label>
                    <input type="text" id="nombre">
                    <br>

                    <label for="correo">INGRESE UN CORREO ELECTRÓNICO DE REFERENCIA</label>
                    <input type="email" id="correo">
                    <br>

                    <label for="interes">¿QUÉ PRODUCTO DE NUESTRO CATÁLOGO ES EL QUE LE INTERESA MÁS?</label>
                    <input type="text" id="interes">
                    <br>

                    <label for="categoria">SELECCIONE QUÉ CATEGORÍA FUE MÁS DE SU INTERÉS</label>
                    <input type="radio" id="limpieza" name="categoria">Limpieza<br>
                    <input type="radio" id="autos" name="categoria">Autos<br>
                    <input type="radio" id="jarceria" name="categoria">Jarceria<br>
                    <input type="radio" id="belleza" name="categoria">Belleza<br>

                    <label for="experiencia">¿CÓMO FUE SU EXPERIENCIA CON NOSOTROS?</label>
                    <input type="radio" id="excelente" name="experiencia">Excelente<br>
                    <input type="radio" id="buena" name="experiencia">Buena<br>
                    <input type="radio" id="regular" name="experiencia">Regular<br>
                    <input type="radio" id="mala" name="experiencia">Mala<br>
            </form>

            <div class="botones">
            <a href="clientes.html" class="btn">ENVIAR OPINIÓN</a>
            </div>
            <br>

        </center>
    </main>

</body>
</html>
